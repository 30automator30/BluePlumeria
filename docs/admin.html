<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blue Plumeria — Owner Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fcfaf6; --bone:#f5f0e7; --sand:#ece4d6; --card:#ffffff;
    --ink:#1c1712; --ink-soft:#3a332b; --muted:#8a7f6e;
    --border:#e4dbcc; --border-soft:#efe8db;
    --gold:#b08d4f; --gold-deep:#8c6d37; --slate:#6e8ca6; --slate-deep:#47617a;
    --good:#5a8a5f; --warn:#b4553f;
    --shadow:0 14px 34px -20px rgba(28,23,18,.4);
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1140px; margin:0 auto; padding:0 22px; }
  h1,h2,h3{ font-family:var(--serif); font-weight:600; line-height:1.1; }

  /* login gate */
  #login{ min-height:100vh; display:grid; place-items:center; padding:22px; }
  .login-card{ width:400px; max-width:100%; background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:38px 34px; text-align:center; }
  .login-card .brand{ font-family:var(--serif); font-size:1.9rem; letter-spacing:.01em; }
  .login-card .brand small{ display:block; font-family:var(--sans); font-size:.66rem; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
  .login-card p.sub{ color:var(--muted); font-size:.9rem; margin:18px 0 24px; }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{ font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--muted); display:block; margin-bottom:6px; }
  .field input{ width:100%; border:1px solid var(--border); border-radius:10px; padding:12px 14px; font:inherit; background:var(--paper); color:var(--ink); }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .btn{ font:inherit; font-weight:600; cursor:pointer; border:none; border-radius:10px; padding:12px 20px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s; }
  .btn-gold{ background:var(--gold); color:#fff; width:100%; } .btn-gold:hover{ background:var(--gold-deep); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--border); } .btn-ghost:hover{ border-color:var(--gold); }
  .err{ color:var(--warn); font-size:.85rem; margin-top:12px; min-height:1.2em; }

  /* app shell */
  #app{ display:none; }
  .top{ background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .top .wrap{ display:flex; align-items:center; gap:16px; padding:14px 22px; }
  .top .brand{ font-family:var(--serif); font-size:1.35rem; }
  .top .brand small{ font-family:var(--sans); font-size:.6rem; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); display:block; }
  .top .who{ margin-left:auto; font-size:.82rem; color:var(--muted); }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); background:var(--card); }
  .tabs .wrap{ display:flex; gap:4px; padding:0 22px; }
  .tab{ font:inherit; font-size:.9rem; font-weight:600; cursor:pointer; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; padding:13px 14px; }
  .tab.on{ color:var(--ink); border-bottom-color:var(--gold); } .tab:hover{ color:var(--ink); }
  main{ padding:26px 0 70px; }
  .h{ font-size:1.5rem; margin-bottom:4px; } .sub{ color:var(--muted); font-size:.9rem; margin-bottom:20px; }

  .kpis{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:26px; }
  @media(max-width:900px){ .kpis{ grid-template-columns:repeat(3,1fr); } }
  @media(max-width:560px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .kpi .n{ font-family:var(--serif); font-size:1.8rem; color:var(--gold-deep); }
  .kpi .l{ font-size:.72rem; color:var(--muted); margin-top:4px; letter-spacing:.02em; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; } @media(max-width:820px){ .grid2{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .card h3{ font-size:1.15rem; margin-bottom:14px; display:flex; justify-content:space-between; align-items:baseline; }
  .card h3 .tag{ font-family:var(--sans); font-size:.7rem; font-weight:600; color:var(--muted); }

  table{ width:100%; border-collapse:collapse; font-size:.88rem; }
  th{ text-align:left; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:0 10px 10px; border-bottom:1px solid var(--border); }
  td{ padding:12px 10px; border-bottom:1px solid var(--border-soft); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cust b{ display:block; } .cust span{ color:var(--muted); font-size:.8rem; }
  .badge{ font-size:.68rem; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .badge.paid{ background:color-mix(in srgb,var(--good) 16%,transparent); color:var(--good); }
  .badge.test{ background:var(--sand); color:var(--muted); }
  .chips{ display:flex; gap:8px; margin-bottom:16px; }
  .chip{ font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--muted); padding:7px 14px; border-radius:999px; }
  .chip.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .inv{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .piece{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .piece .ph{ height:150px; background:var(--sand) center/cover no-repeat; position:relative; }
  .piece .ph .st{ position:absolute; top:10px; left:10px; }
  .piece .b{ padding:13px 14px; }
  .piece .nm{ font-family:var(--serif); font-size:1.08rem; line-height:1.2; }
  .piece .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .piece .pr{ color:var(--gold-deep); font-weight:600; font-variant-numeric:tabular-nums; }
  .piece .coll{ font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .piece .toggle{ flex:0 0 auto; font-size:.78rem; padding:8px 12px; white-space:nowrap; }
  .empty{ text-align:center; color:var(--muted); padding:40px 0; }
  .loading{ text-align:center; color:var(--muted); padding:60px 0; }

  /* inline editors */
  .fld{ display:block; margin-bottom:9px; }
  .fld span{ display:block; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .fld input{ width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font:inherit; font-size:.9rem; background:var(--paper); color:var(--ink); }
  .fld input:focus{ outline:none; border-color:var(--gold); }
  .fld.price input{ font-variant-numeric:tabular-nums; }
  .prow{ display:flex; gap:8px; align-items:flex-end; }
  .prow .fld{ flex:1; margin-bottom:0; }
  .save-row{ display:flex; align-items:center; gap:10px; margin-top:11px; }
  .save-row .save{ font-size:.8rem; padding:8px 16px; }
  .save-row .save:disabled{ opacity:.45; cursor:default; }
  .pstat{ font-size:.78rem; color:var(--muted); }
  .pstat.ok{ color:var(--good); } .pstat.bad{ color:var(--warn); }
  .publish-note{ background:color-mix(in srgb,var(--gold) 10%,var(--card)); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:.85rem; color:var(--ink-soft); margin-bottom:18px; }
  .publish-note b{ color:var(--ink); }

  /* inventory groups + item cards */
  .grp-h{ font-family:var(--serif); font-size:1.15rem; color:var(--ink); margin:22px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .grp-h .tier{ font-family:var(--sans); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-left:10px; }
  .items{ display:flex; flex-direction:column; gap:14px; }
  .item{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:760px){ .item{ grid-template-columns:minmax(0,320px) 1fr; } }
  .item .col-r{ min-width:0; }
  .row2{ display:flex; gap:10px; } .row2 .fld{ flex:1; margin-bottom:0; }
  .fld select{ width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font:inherit; font-size:.9rem; background:var(--paper); color:var(--ink); }
  .fld select:focus{ outline:none; border-color:var(--gold); }

  .pill{ font-size:.66rem; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; letter-spacing:.02em; }
  .pill.live{ background:color-mix(in srgb,var(--good) 16%,transparent); color:var(--good); }
  .pill.draft{ background:var(--sand); color:var(--muted); }
  .pill.incomplete{ background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); }
  .item-head{ display:flex; align-items:center; gap:10px; }
  .item-head .move{ margin-left:auto; display:flex; gap:4px; }
  .icon-btn{ font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--ink); border-radius:8px; padding:5px 9px; line-height:1; }
  .icon-btn:hover{ border-color:var(--gold); } .icon-btn:disabled{ opacity:.35; cursor:default; }

  .thumbs{ display:flex; flex-wrap:wrap; gap:8px; }
  .thumb{ position:relative; width:76px; height:76px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--sand); }
  .thumb.is-cart{ border-color:var(--gold); box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-ctl{ position:absolute; inset:auto 0 0 0; display:flex; justify-content:center; gap:2px; background:color-mix(in srgb,#000 55%,transparent); padding:2px; opacity:0; transition:.12s; }
  .thumb:hover .thumb-ctl,.thumb:focus-within .thumb-ctl{ opacity:1; }
  .thumb-ctl button{ font:inherit; font-size:.72rem; line-height:1; cursor:pointer; border:none; background:transparent; color:#fff; padding:2px 3px; }
  .thumb-ctl button:disabled{ opacity:.4; cursor:default; }
  .thumb.is-cart::after{ content:"★"; position:absolute; top:3px; left:5px; color:var(--gold); font-size:.8rem; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .thumb.add{ display:grid; place-items:center; font-size:1.6rem; color:var(--muted); cursor:pointer; border-style:dashed; }
  .thumb.add:hover{ border-color:var(--gold); color:var(--gold); }
  .thumb.busy{ display:grid; place-items:center; font-size:.7rem; color:var(--muted); }

  .actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:2px; }
  .actions .btn{ font-size:.78rem; padding:8px 13px; }
  .add-piece{ background:var(--card); border:1px dashed var(--border); border-radius:14px; padding:16px; margin-bottom:8px; }
  .add-piece.open{ border-style:solid; }
  .add-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0; } @media(max-width:560px){ .add-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <form class="login-card" id="loginForm">
    <div class="brand">Blue Plumeria<small>Owner Dashboard</small></div>
    <p class="sub">Sign in to view orders &amp; inventory.</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-gold" type="submit" id="loginBtn">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<!-- APP -->
<div id="app">
  <div class="top"><div class="wrap">
    <div class="brand">Blue Plumeria<small>Owner Dashboard</small></div>
    <span class="who" id="who"></span>
    <button class="btn btn-ghost" id="signout" style="padding:8px 14px">Sign out</button>
  </div></div>
  <nav class="tabs"><div class="wrap">
    <button class="tab on" data-tab="overview">Overview</button>
    <button class="tab" data-tab="orders">Orders</button>
    <button class="tab" data-tab="inventory">Inventory</button>
  </div></nav>
  <main><div class="wrap" id="view"><div class="loading">Loading…</div></div></main>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SB = createClient(
  "https://ktjxrxchrxtmyvlfsyof.supabase.co",
  "sb_publishable_8NSnU6lGLIt9GplZ-7hHUw_XvtDmX2s",
);

const $ = (s) => document.querySelector(s);
const money = (v) => "$" + Number(v || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—";

let ORDERS = [], PRODUCTS = [], activeTab = "overview", orderFilter = "all", PRODUCTS_ERR = null;

/* ---- auth ---- */
async function boot() {
  const { data: { session } } = await SB.auth.getSession();
  if (session) showApp(session); else showLogin();
}
function showLogin() { $("#login").style.display = "grid"; $("#app").style.display = "none"; }
async function showApp(session) {
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  $("#who").textContent = session.user.email;
  await loadData();
  render();
}
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = ""; $("#loginBtn").disabled = true; $("#loginBtn").textContent = "Signing in…";
  const { data, error } = await SB.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  $("#loginBtn").disabled = false; $("#loginBtn").textContent = "Sign in";
  if (error) { $("#loginErr").textContent = error.message; return; }
  showApp(data.session);
});
$("#signout").addEventListener("click", async () => { await SB.auth.signOut(); showLogin(); });

/* ---- data ---- */
async function loadData() {
  const [o, p] = await Promise.all([
    SB.from("orders").select("*, order_items(*)").order("placed_at", { ascending: false }),
    SB.from("products").select("*").order("sku"),
  ]);
  ORDERS = o.data || [];
  PRODUCTS = p.data || [];
  PRODUCTS_ERR = p.error || null;
  if (o.error) console.error(o.error);
  if (p.error) console.error(p.error);
}

/* ---- tabs ---- */
document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => {
    activeTab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    render();
  }));

function render() {
  const v = $("#view");
  if (activeTab === "overview") v.innerHTML = overview();
  else if (activeTab === "orders") { v.innerHTML = orders(); wireOrderChips(); }
  else v.innerHTML = inventory(), wireInventory();
}

/* ---- overview ---- */
function overview() {
  const paid = ORDERS.filter((o) => o.status === "paid");
  const testCount = ORDERS.length - paid.length;
  const revenue = paid.reduce((s, o) => s + Number(o.total || 0), 0);
  const itemsSold = ORDERS.flatMap((o) => o.order_items || []).reduce((s, i) => s + (i.quantity || 0), 0);
  const avail = PRODUCTS.filter((p) => p.available).length;
  const sold = PRODUCTS.length - avail;
  const kpis = [
    [paid.length, "Paid orders"],
    [money(revenue), "Revenue"],
    [paid.length ? money(revenue / paid.length) : "—", "Avg order"],
    [itemsSold, "Items sold"],
    [avail, "Pieces available"],
    [sold, "Pieces sold"],
  ];
  const recent = ORDERS.slice(0, 5).map(orderRow).join("") || `<tr><td class="empty">No orders yet.</td></tr>`;
  // top pieces by qty
  const tally = {};
  ORDERS.flatMap((o) => o.order_items || []).forEach((i) => {
    if (!i.sku) return; tally[i.sku] = tally[i.sku] || { name: i.name, qty: 0, rev: 0 };
    tally[i.sku].qty += i.quantity || 0; tally[i.sku].rev += Number(i.line_total || 0);
  });
  const top = Object.entries(tally).sort((a, b) => b[1].qty - a[1].qty).slice(0, 6);
  const topRows = top.map(([sku, t]) => `<tr><td class="cust"><b>${esc(t.name)}</b><span>${esc(sku)}</span></td><td class="num">${t.qty}</td><td class="num">${money(t.rev)}</td></tr>`).join("") || `<tr><td class="empty">Nothing sold yet.</td></tr>`;

  return `
    <h2 class="h">This week at a glance</h2>
    <p class="sub">Your live store — orders, revenue, and one-of-a-kind stock in one place.${testCount ? ` <b>(${testCount} test order${testCount > 1 ? "s" : ""} excluded from revenue.)</b>` : ""}</p>
    <div class="kpis">${kpis.map(([n, l]) => `<div class="kpi"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
    <div class="grid2">
      <div class="card"><h3>Recent orders <span class="tag">${ORDERS.length} total</span></h3>
        <table><thead><tr><th>Date</th><th>Customer</th><th style="text-align:right">Total</th><th></th></tr></thead><tbody>${recent}</tbody></table></div>
      <div class="card"><h3>Best sellers</h3>
        <table><thead><tr><th>Piece</th><th style="text-align:right">Sold</th><th style="text-align:right">Revenue</th></tr></thead><tbody>${topRows}</tbody></table></div>
    </div>`;
}

/* ---- orders ---- */
function orderRow(o) {
  const items = (o.order_items || []).map((i) => `${i.quantity}× ${esc(i.name || i.sku)}`).join(", ");
  return `<tr>
    <td>${fmtDate(o.placed_at)}</td>
    <td class="cust"><b>${esc(o.customer_name || "—")}</b><span>${items}</span></td>
    <td class="num">${money(o.total)}</td>
    <td><span class="badge ${o.status === "paid" ? "paid" : "test"}">${esc(o.status)}</span></td>
  </tr>`;
}
function orders() {
  const rows = ORDERS.filter((o) => orderFilter === "all" || o.status === orderFilter);
  const body = rows.map((o) => `<tr>
      <td>${fmtDate(o.placed_at)}</td>
      <td class="cust"><b>${esc(o.customer_name || "—")}</b><span>${esc(o.email || "")}</span></td>
      <td>${(o.order_items || []).map((i) => `${i.quantity}× ${esc(i.name || i.sku)}`).join("<br>") || "—"}</td>
      <td class="num">${money(o.total)}</td>
      <td><span class="badge ${o.status === "paid" ? "paid" : "test"}">${esc(o.status)}</span></td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">No orders in this view.</td></tr>`;
  return `
    <h2 class="h">Orders</h2>
    <p class="sub">Every order, captured live from Snipcart.</p>
    <div class="chips" id="ochips">
      ${["all", "paid", "test"].map((f) => `<button class="chip ${orderFilter === f ? "on" : ""}" data-f="${f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join("")}
    </div>
    <div class="card"><table>
      <thead><tr><th>Date</th><th>Customer</th><th>Items</th><th style="text-align:right">Total</th><th>Status</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}
function wireOrderChips() {
  document.querySelectorAll("#ochips .chip").forEach((c) =>
    c.addEventListener("click", () => { orderFilter = c.dataset.f; render(); }));
}

/* ---- inventory ---- */
const COLLECTIONS = [["sea-shore", "Sea & Shore"], ["stone-earth", "Stone & Earth"], ["pearl-crystal", "Pearl & Crystal"], ["hand-woven", "Hand-Woven"]];
const TIERS = [["signature", "Signature"], ["everyday", "Everyday"]];
const BUCKET = "product-images";

const imgsOf = (p) => Array.isArray(p.images) ? p.images : [];
// Shared "complete" definition — MUST match catalog/sync-from-supabase.py.
const isComplete = (p) => imgsOf(p).length >= 1 && String(p.name || "").trim() !== "" && Number(p.price) > 0;
function statusOf(p) {
  if (!p.published) return ["draft", "Draft"];
  return isComplete(p) ? ["live", "Live"] : ["incomplete", "Published — needs photo & price"];
}
function invSubText() {
  const live = PRODUCTS.filter((p) => p.published && isComplete(p)).length;
  const draft = PRODUCTS.filter((p) => !p.published).length;
  const avail = PRODUCTS.filter((p) => p.available).length;
  return `${live} live · ${draft} draft · ${avail} available · ${PRODUCTS.length} total. New pieces stay drafts until you add a photo, set a price, and hit Publish.`;
}
const setStat = (el, msg, cls) => { if (el) { el.textContent = msg; el.className = "pstat" + (cls ? " " + cls : ""); } };

// ---- images: downscale then upload/delete on Supabase Storage ----
function downscale(file, max = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url0 = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { URL.revokeObjectURL(url0); return reject(new Error("empty image")); }
      if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);  // flatten transparency (JPEG has no alpha)
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url0);
      c.toBlob((b) => b ? resolve(b) : reject(new Error("encode failed")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url0); reject(new Error("Couldn't read that image (HEIC isn't supported — use JPG or PNG)")); };
    img.src = url0;
  });
}
const keyFromUrl = (url) => { const m = /\/product-images\/(.+)$/.exec(url || ""); return m ? decodeURIComponent(m[1]) : null; };
async function uploadPhoto(sku, file) {
  const blob = await downscale(file);
  const key = `${sku}/${Date.now()}.jpg`;                 // write-once key — never overwrite (dodges CDN staleness)
  const up = await SB.storage.from(BUCKET).upload(key, blob, { contentType: "image/jpeg", upsert: false });
  if (up.error) throw up.error;
  return SB.storage.from(BUCKET).getPublicUrl(key).data.publicUrl;
}
// .select() so a 0-row / RLS-rejected write is caught (PostgREST returns 2xx, no error).
async function patchProduct(sku, patch, cols = "sku") {
  const { data, error } = await SB.from("products").update(patch).eq("sku", sku).select(cols);
  if (error) return { ok: false, msg: "Error — " + error.message };
  if (!data || !data.length) return { ok: false, msg: "Not saved — sign in as the owner account" };
  return { ok: true, row: data[0] };
}

function inventory() {
  if (PRODUCTS_ERR) {
    return `<h2 class="h">Inventory</h2>
      <div class="publish-note" style="border-color:var(--warn)">Couldn't load your catalog (${esc(PRODUCTS_ERR.message || "network error")}). Editing is disabled until it loads — refresh to retry. Nothing was changed.</div>`;
  }
  const sorted = [...PRODUCTS].sort((a, b) => (a.position ?? 1e9) - (b.position ?? 1e9) || String(a.sku).localeCompare(b.sku));
  const known = new Set();
  const renderGroup = (items) => items.map((p, i) => itemCard(p, i === 0, i === items.length - 1)).join("");
  let groups = "";
  for (const [tk, tl] of TIERS) for (const [ck, cl] of COLLECTIONS) {
    const items = sorted.filter((p) => (p.tier || "signature") === tk && p.collection === ck);
    items.forEach((p) => known.add(p.sku));
    if (!items.length) continue;
    groups += `<div class="grp-h">${esc(cl)}<span class="tier">${esc(tl)}</span></div>
      <div class="items" data-tier="${tk}" data-collection="${ck}">${renderGroup(items)}</div>`;
  }
  // Safety net: anything with an unexpected/blank collection or tier still shows
  // (and stays editable) instead of silently vanishing from the admin.
  const leftover = sorted.filter((p) => !known.has(p.sku));
  if (leftover.length) {
    groups += `<div class="grp-h">Uncategorized<span class="tier">Fix collection/tier</span></div>
      <div class="items" data-tier="" data-collection="">${renderGroup(leftover)}</div>`;
  }
  return `
    <h2 class="h">Inventory</h2>
    <p class="sub" id="inv-sub">${invSubText()}</p>
    <div class="publish-note">Edits save to your store's database and the storefront <b>refreshes automatically within a few minutes</b>. Add a piece, upload photos, then Publish to put it live.</div>
    <div class="add-piece" id="addPiece">
      <button class="btn btn-gold" id="addToggle">+ Add a piece</button>
      <div id="addForm" style="display:none">
        <div class="add-grid">
          <label class="fld"><span>Name</span><input id="a-name"></label>
          <label class="fld price"><span>Price ($)</span><input id="a-price" type="number" min="0.01" step="0.01"></label>
          <label class="fld"><span>Collection</span><select id="a-collection">${COLLECTIONS.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("")}</select></label>
          <label class="fld"><span>Tier</span><select id="a-tier">${TIERS.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("")}</select></label>
          <label class="fld"><span>Label (optional)</span><input id="a-label" placeholder="e.g. Studio Series"></label>
          <label class="fld"><span>SKU (optional)</span><input id="a-sku" placeholder="auto-generated"></label>
        </div>
        <div class="save-row"><button class="btn btn-gold" id="addSave">Create draft</button><button class="btn btn-ghost" id="addCancel">Cancel</button><span class="pstat" id="addStat"></span></div>
      </div>
    </div>
    ${groups || `<div class="empty">No pieces yet — add your first above.</div>`}`;
}

function renderThumbs(p) {
  const list = imgsOf(p).map((im, i) => `
    <div class="thumb ${im.url === p.cart_image ? "is-cart" : ""}" data-i="${i}">
      <img src="${esc(im.url)}" alt="">
      <div class="thumb-ctl">
        <button data-act="img-left" title="Move left" ${i === 0 ? "disabled" : ""}>◀</button>
        <button data-act="img-star" title="Use as cart image">★</button>
        <button data-act="img-right" title="Move right" ${i === imgsOf(p).length - 1 ? "disabled" : ""}>▶</button>
        <button data-act="img-del" title="Delete photo">×</button>
      </div>
    </div>`).join("");
  return list + `<label class="thumb add" title="Add photo"><span class="plus">+</span><input type="file" accept="image/jpeg,image/png,image/webp" hidden data-act="img-add"></label>`;
}

function itemCard(p, isFirst = false, isLast = false) {
  const [sk, sl] = statusOf(p);
  return `<div class="item" data-sku="${esc(p.sku)}">
    <div class="col-l"><div class="thumbs">${renderThumbs(p)}</div></div>
    <div class="col-r">
      <div class="item-head">
        <span class="pill st-pill ${sk}">${esc(sl)}</span>
        <span class="pill sold-pill draft" style="${p.available ? "display:none" : ""}">Sold</span>
        <span style="font-size:.72rem;color:var(--muted)">${esc(p.sku)}</span>
        <span class="move"><button class="icon-btn" data-act="up" title="Move up" ${isFirst ? "disabled" : ""}>▲</button><button class="icon-btn" data-act="down" title="Move down" ${isLast ? "disabled" : ""}>▼</button></span>
      </div>
      <label class="fld"><span>Name</span><input class="e" data-f="name" value="${esc(p.name)}"></label>
      <div class="row2">
        <label class="fld"><span>Collection</span><select class="e" data-f="collection">${COLLECTIONS.map(([k, l]) => `<option value="${k}" ${p.collection === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
        <label class="fld"><span>Tier</span><select class="e" data-f="tier">${TIERS.map(([k, l]) => `<option value="${k}" ${(p.tier || "signature") === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
      </div>
      <div class="row2">
        <label class="fld price"><span>Price ($)</span><input class="e" data-f="price" type="number" min="0.01" step="0.01" value="${esc(p.price)}"></label>
        <label class="fld"><span>Label</span><input class="e" data-f="label" value="${esc(p.label || "")}"></label>
      </div>
      <div class="save-row"><button class="btn btn-gold save" disabled>Save</button><span class="pstat"></span></div>
      <div class="actions">
        <button class="btn btn-ghost pub">${p.published ? "Unpublish" : "Publish"}</button>
        <button class="btn btn-ghost avail">${p.available ? "Mark sold" : "Mark available"}</button>
      </div>
    </div>
  </div>`;
}

function refreshStatus(card, p) {
  const [sk, sl] = statusOf(p);
  const pill = card.querySelector(".st-pill");
  if (pill) { pill.className = "pill st-pill " + sk; pill.textContent = sl; }
  const sub = document.getElementById("inv-sub"); if (sub) sub.textContent = invSubText();
}

function wireInventory() {
  // --- Add a piece ---
  const addToggle = $("#addToggle"), addForm = $("#addForm"), addPiece = $("#addPiece");
  if (addToggle) {
    addToggle.addEventListener("click", () => {
      const open = addForm.style.display === "none";
      addForm.style.display = open ? "block" : "none";
      addPiece.classList.toggle("open", open);
      addToggle.textContent = open ? "Close" : "+ Add a piece";
    });
    $("#addCancel").addEventListener("click", () => { addForm.style.display = "none"; addPiece.classList.remove("open"); addToggle.textContent = "+ Add a piece"; });
    const addSave = $("#addSave");
    addSave.addEventListener("click", async () => {
      const stat = $("#addStat");
      const name = $("#a-name").value.trim(), price = Number($("#a-price").value);
      const collection = $("#a-collection").value, tier = $("#a-tier").value;
      const label = $("#a-label").value.trim();
      let sku = $("#a-sku").value.trim();
      if (!name) return setStat(stat, "Name is required", "bad");
      if (!(Number.isFinite(price) && price > 0)) return setStat(stat, "Price must be greater than 0", "bad");
      if (!sku) sku = "BP-" + Date.now().toString(36).toUpperCase();
      // SKU is a Snipcart item-id, an HTML attribute value, and a Storage path
      // key — keep it to safe characters.
      if (!/^[A-Za-z0-9_-]{2,40}$/.test(sku)) return setStat(stat, "SKU: letters, numbers, - and _ only (2–40 chars)", "bad");
      addSave.disabled = true; setStat(stat, "Creating…");
      const row = { sku, name, price, collection, tier, label: label || null, images: [], cart_image: null, available: true, max_quantity: 1, item_url: "/shop.html", published: false };
      const { data, error } = await SB.from("products").insert(row).select("*");
      addSave.disabled = false;
      if (error) return setStat(stat, error.code === "23505" ? "That SKU already exists" : "Error — " + error.message, "bad");
      if (!data || !data.length) return setStat(stat, "Not saved — sign in as the owner account", "bad");
      PRODUCTS.push(data[0]);
      render();   // structural change — rebuild so the new draft lands in its group
    });
  }

  document.querySelectorAll(".item").forEach((card) => wireItem(card));
}

function wireItem(card) {
  const sku = card.dataset.sku;
  const p = PRODUCTS.find((x) => x.sku === sku); if (!p) return;
  const inputs = [...card.querySelectorAll(".e")];
  const saveBtn = card.querySelector(".save");
  const stat = card.querySelector(".save-row .pstat");
  const priceInput = card.querySelector('input[data-f="price"]');
  const nameInput = card.querySelector('input[data-f="name"]');

  // ---- field editing (name/label/price/collection/tier) ----
  const changedFields = () => {
    const o = {};
    inputs.forEach((i) => {
      const f = i.dataset.f;
      if (f === "price") { const n = Number(i.value); if (Number.isFinite(n) && n > 0 && n !== Number(p.price)) o.price = n; }
      else { const v = i.value.trim(); if (v !== String(p[f] ?? "").trim()) o[f] = v; }
    });
    return o;
  };
  const invalidReason = () => {
    const n = Number(priceInput.value);
    if (!(Number.isFinite(n) && n > 0)) return "Price must be greater than 0";
    if (!nameInput.value.trim()) return "Name can't be empty";
    return null;
  };
  const refresh = () => {
    const bad = invalidReason(), dirty = Object.keys(changedFields()).length > 0;
    saveBtn.disabled = !dirty || !!bad;
    setStat(stat, bad || (dirty ? "Unsaved changes" : ""), bad ? "bad" : "");
  };
  let saving = false;
  const save = async () => {
    if (saving || saveBtn.disabled || invalidReason()) return;
    const patch = changedFields(); if (!Object.keys(patch).length) return;
    saving = true; saveBtn.disabled = true; saveBtn.textContent = "Saving…"; setStat(stat, "");
    const r = await patchProduct(sku, patch, "sku,name,label,price,collection,tier");
    saving = false; saveBtn.textContent = "Save";
    if (!r.ok) { setStat(stat, r.msg, "bad"); refresh(); return; }
    const moved = ("collection" in patch) || ("tier" in patch);
    Object.assign(p, r.row);
    // A collection/tier change moves the piece to a different group — rebuild so
    // it lands there and the reorder arrows can't swap across stale groups.
    if (moved) { render(); return; }
    inputs.forEach((i) => { i.value = String(r.row[i.dataset.f] ?? ""); });
    setStat(stat, "Saved · live in a few min", "ok"); saveBtn.disabled = true;
    refreshStatus(card, p);
  };
  inputs.forEach((i) => {
    i.addEventListener("input", refresh); i.addEventListener("change", refresh);
    i.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });
  });
  saveBtn.addEventListener("click", save);

  // ---- availability toggle ----
  const availBtn = card.querySelector(".avail");
  availBtn.addEventListener("click", async () => {
    availBtn.disabled = true; const prev = availBtn.textContent; availBtn.textContent = "Saving…";
    const r = await patchProduct(sku, { available: !p.available }, "sku,available");
    availBtn.disabled = false;
    if (!r.ok) { availBtn.textContent = prev; setStat(stat, r.msg, "bad"); return; }
    p.available = r.row.available;
    availBtn.textContent = p.available ? "Mark sold" : "Mark available";
    const soldPill = card.querySelector(".sold-pill"); if (soldPill) soldPill.style.display = p.available ? "none" : "";
    refreshStatus(card, p);
  });

  // ---- publish / unpublish ----
  const pubBtn = card.querySelector(".pub");
  let confirmingUnpub = false, unpubTimer = null;
  pubBtn.addEventListener("click", async () => {
    if (!p.published) {
      if (!isComplete(p)) { setStat(stat, "Add a photo and a price (and Save) before publishing.", "bad"); return; }
      pubBtn.disabled = true; pubBtn.textContent = "Publishing…";
      const r = await patchProduct(sku, { published: true }, "sku,published");
      pubBtn.disabled = false;
      if (!r.ok) { pubBtn.textContent = "Publish"; setStat(stat, r.msg, "bad"); return; }
      p.published = true; pubBtn.textContent = "Unpublish"; setStat(stat, "Published · live in a few min", "ok"); refreshStatus(card, p);
      return;
    }
    // unpublish = takedown -> two-step confirm (no browser dialog)
    if (!confirmingUnpub) {
      confirmingUnpub = true; pubBtn.textContent = "Confirm remove?"; pubBtn.classList.add("btn-ghost");
      setStat(stat, "This removes it from the live store.", "bad");
      unpubTimer = setTimeout(() => { confirmingUnpub = false; pubBtn.textContent = "Unpublish"; setStat(stat, ""); }, 4000);
      return;
    }
    clearTimeout(unpubTimer); confirmingUnpub = false;
    pubBtn.disabled = true; pubBtn.textContent = "Removing…";
    const r = await patchProduct(sku, { published: false }, "sku,published");
    pubBtn.disabled = false;
    if (!r.ok) { pubBtn.textContent = "Unpublish"; setStat(stat, r.msg, "bad"); return; }
    p.published = false; pubBtn.textContent = "Publish"; setStat(stat, "Removed from store", "ok"); refreshStatus(card, p);
  });

  // ---- item reorder (within the collection group) ----
  const groupSku = (dir) => {
    const items = [...card.parentElement.querySelectorAll(":scope > .item")];
    const idx = items.indexOf(card); const other = items[idx + dir];
    return other ? other : null;
  };
  card.querySelectorAll(".move .icon-btn").forEach((btn) => btn.addEventListener("click", async () => {
    const dir = btn.dataset.act === "up" ? -1 : 1;
    const other = groupSku(dir); if (!other) return;
    const otherSku = other.dataset.sku, op = PRODUCTS.find((x) => x.sku === otherSku);
    btn.disabled = true;
    const { data, error } = await SB.rpc("swap_positions", { sku_a: sku, sku_b: otherSku });
    btn.disabled = false;
    if (error) { setStat(stat, "Couldn't reorder — " + error.message, "bad"); return; }
    if (!data) { setStat(stat, "Not saved — sign in as the owner account", "bad"); return; }  // RLS no-op returns 0 rows
    const tmp = p.position; p.position = op.position; op.position = tmp;
    if (dir === -1) card.parentElement.insertBefore(card, other);
    else card.parentElement.insertBefore(other, card);
    [card, other].forEach((c) => {
      const items = [...c.parentElement.querySelectorAll(":scope > .item")]; const i = items.indexOf(c);
      c.querySelector('[data-act="up"]').disabled = i === 0;
      c.querySelector('[data-act="down"]').disabled = i === items.length - 1;
    });
  }));

  // ---- photo strip (delegated so it survives innerHTML re-renders) ----
  const thumbsEl = card.querySelector(".thumbs");
  const rerenderThumbs = () => { thumbsEl.innerHTML = renderThumbs(p); refreshStatus(card, p); };
  thumbsEl.addEventListener("change", async (e) => {
    const inp = e.target.closest('input[data-act="img-add"]'); if (!inp || !inp.files[0]) return;
    const add = thumbsEl.querySelector(".thumb.add");
    if (add.classList.contains("busy")) return;   // one upload at a time — avoid last-write-wins on images
    const file = inp.files[0]; inp.value = "";
    // Busy state via a class + the .plus span only — never touch the label's
    // children (that would delete the hidden <input> and kill retry).
    const plus = add.querySelector(".plus");
    const busyOff = () => { add.classList.remove("busy"); if (plus) plus.textContent = "+"; };
    add.classList.add("busy"); if (plus) plus.textContent = "…";
    try {
      const url = await uploadPhoto(sku, file);
      const newImgs = [...imgsOf(p), { url, alt: p.name }];
      const patch = { images: newImgs }; if (!p.cart_image) patch.cart_image = url;
      const r = await patchProduct(sku, patch, "sku,images,cart_image");
      if (!r.ok) { setStat(stat, r.msg, "bad"); busyOff(); return; }
      p.images = r.row.images; p.cart_image = r.row.cart_image; rerenderThumbs();
    } catch (err) { setStat(stat, err.message || "Upload failed", "bad"); busyOff(); }
  });
  thumbsEl.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const wrap = btn.closest(".thumb"); const i = Number(wrap.dataset.i); const act = btn.dataset.act;
    const list = imgsOf(p).slice();
    if (act === "img-star") {
      const r = await patchProduct(sku, { cart_image: list[i].url }, "sku,cart_image");
      if (!r.ok) return setStat(stat, r.msg, "bad");
      p.cart_image = r.row.cart_image; rerenderThumbs(); return;
    }
    if (act === "img-left" || act === "img-right") {
      const j = i + (act === "img-left" ? -1 : 1); if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      const r = await patchProduct(sku, { images: list }, "sku,images");
      if (!r.ok) return setStat(stat, r.msg, "bad");
      p.images = r.row.images; rerenderThumbs(); return;
    }
    if (act === "img-del") {
      const removed = list.splice(i, 1)[0];
      const patch = { images: list };
      if (removed.url === p.cart_image) patch.cart_image = list[0] ? list[0].url : null;
      const r = await patchProduct(sku, patch, "sku,images,cart_image");
      if (!r.ok) return setStat(stat, r.msg, "bad");
      p.images = r.row.images; p.cart_image = r.row.cart_image;
      const key = keyFromUrl(removed.url);
      if (key) SB.storage.from(BUCKET).remove([key]);   // best-effort orphan cleanup
      rerenderThumbs();
    }
  });
}

boot();
</script>
</body>
</html>
